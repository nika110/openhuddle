# A public vibecrew hub with automatic HTTPS.
#   VIBECREW_DOMAIN=crew.example.com docker compose up -d --build
# The domain must point at this server, and ports 80 and 443 must be free and open.
# No domain? <your-ip-with-dashes>.sslip.io works, e.g. 203-0-113-7.sslip.io.
services:
  hub:
    build: ..
    restart: unless-stopped
    environment:
      VIBECREW_PUBLIC_URL: https://${VIBECREW_DOMAIN:?set VIBECREW_DOMAIN}
      VIBECREW_TRUST_PROXY: "1"
    volumes:
      - hub-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      VIBECREW_DOMAIN: ${VIBECREW_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - hub

volumes:
  hub-data:
  caddy-data:
